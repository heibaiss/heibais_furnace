modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="Heibai's Furnace"
logoFile="Furnace.png"
authors="${mod_authors}"
description='''让我的世界原版熔炉能一次性烧完当前熔炉里面的所有东西。
Heibai's Furnace makes Minecraft vanilla furnaces smelt all items inside at once!'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
